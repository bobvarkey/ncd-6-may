name: ncd_rx
description: "NCD Rx — point-of-care clinical decision support for diabetes, hypertension, lipids, obesity, kidney and serious infections."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/infections.json

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3.ttf
