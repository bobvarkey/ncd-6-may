name: ncd_rx
description: "NCD Rx — point-of-care clinical decision support for diabetes, hypertension, lipids, obesity, kidney and serious infections."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  http: ^1.6.0
  cryptography: ^2.9.0
  file_saver: ^0.7.0
  image_picker: ^1.2.4
  file_picker: ^13.2.0
  pdfrx: ^2.10.1
  crop_your_image: ^2.0.1
  image: ^4.12.0
  path_provider: ^2.1.6
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/infections.json

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3.ttf
